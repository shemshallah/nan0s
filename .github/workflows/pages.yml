name: Publish NaN/0S browser demo

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy browser demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify files for public demo
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/nan0s.img
          test -f docs/.nojekyll
          grep -q 'nan0s.img' docs/index.html
          grep -q 'v86.wasm' docs/index.html
          echo "Browser player and boot image are present."
          ls -lh docs/index.html docs/nan0s.img

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
