name: NaN16 Coq mirror kernel check

on:
  push:
    paths:
      - 'formal/nan16/**'
      - '.github/workflows/nan16-coq.yml'
  pull_request:
    paths:
      - 'formal/nan16/**'
      - '.github/workflows/nan16-coq.yml'
  workflow_dispatch:

jobs:
  coq:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: |
          sudo apt-get install -y coq
          coqc --version
      - name: Check formal proofs with the Coq kernel
        run: |
          cd formal/nan16
          set +e
          coqc -q NaN16Mirror.v
          mirror_status=$?
          coqc -q NaN16Bits.v
          bits_status=$?
          if [ "$mirror_status" -eq 0 ]; then
            coqc -q NaN16Signed.v
            signed_status=$?
          else
            echo 'Signed module deferred: mirror foundation did not compile.'
            signed_status=1
          fi
          if [ "$mirror_status" -eq 0 ] && [ "$signed_status" -eq 0 ]; then
            coqc -q NaN16Memory.v
            memory_status=$?
          else
            echo 'Memory module deferred: foundation did not compile.'
            memory_status=1
          fi
          if [ "$memory_status" -eq 0 ]; then
            coqc -q NaN16MemoryAlgebra.v
            algebra_status=$?
          else
            echo 'R5 algebra module deferred: R4 memory module did not compile.'
            algebra_status=1
          fi
          if [ "$mirror_status" -ne 0 ] || [ "$bits_status" -ne 0 ] || [ "$signed_status" -ne 0 ] || [ "$memory_status" -ne 0 ] || [ "$algebra_status" -ne 0 ]; then
            exit 1
          fi
      - name: Run exhaustive arithmetic regression
        if: always()
        run: |
          python3 formal/nan16/check_counts.py
          python3 formal/nan16/check_bit_reverse.py
          python3 formal/nan16/check_signed.py
          python3 formal/nan16/check_memory.py
          python3 formal/nan16/check_memory_algebra.py
