name: Publish rebuilt NaN/0S guest image

on:
  push:
    branches: [main]
    paths:
      - "src/exhibits/gui_cart.nas"
      - "src/lib/bootbuild.nas"
      - "tools/build.sh"
      - ".github/workflows/rebuild-guest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nan0s-guest-image-publisher
  # A new source revision supersedes an obsolete publishing run.
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild guest, test native boot, update published image
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Install only missing image-build and QEMU test tools (bounded)
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          missing=()
          for tool in gawk xxd qemu-system-i386 ffprobe; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if (("${#missing[@]}" == 0)); then
            echo "Required tooling already present; skipping apt entirely."
          else
            echo "Missing tooling: ${missing[*]}"
            export DEBIAN_FRONTEND=noninteractive
            timeout 65s sudo apt-get -o Acquire::Retries=0               -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            timeout 105s sudo apt-get -o Dpkg::Use-Pty=0 install               --no-install-recommends -y gawk xxd qemu-system-x86 ffmpeg
          fi
          for tool in gawk xxd qemu-system-i386 ffprobe; do
            command -v "$tool" >/dev/null || { echo "::error::Missing $tool"; exit 1; }
          done

      - name: Rebuild GUI from source and regenerate full-system image
        shell: bash
        run: |
          set -euo pipefail
          sh tools/build.sh
          cmp build/nan0s.img docs/nan0s.img
          test "$(stat -c %s docs/nan0s.img)" -ge 1474560

      - name: Validate native full GUI and IDE loader
        shell: bash
        run: sh tools/qgate_gui.sh

      - name: Commit generated artifacts to main for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- src/nan/gui_cart.nan build/nan0s.img docs/nan0s.img aarch64/android/app/src/main/assets/nan0s.img
          if git diff --cached --quiet; then
            echo "Generated image already matches source."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "build: publish guest GUI fix and synchronized WASM image"
          # A normal fast-forward push; never overwrite somebody else's changes.
          git push origin HEAD:main
